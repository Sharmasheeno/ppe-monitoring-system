name: ppe_mobile
description: "A new Flutter project for PPE Monitoring."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  socket_io_client: ^3.1.3
  flutter_secure_storage: ^10.0.0
  audioplayers: ^5.2.1
  mqtt_client: ^10.0.1
  device_preview: ^1.1.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
